name: Using Actions
on: 
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/react-app
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Printing Folders
              run: tree
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: 24.x
            - name: Install Dependencies
              run: npm ci
            - name: Run Tests
              run: npm run test