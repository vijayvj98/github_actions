name: 15-Working with Matrices

on:
    workflow_dispatch:
jobs:
    backwards-compatibility:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: ['24.x', '26.x']
                os: [ubuntu-latest, windows-latest]
                include:
                    - node-version: '24.x'
                      os: 'ubuntu-latest'
                    - node-version: '26.x'
                      os: ubuntu-latest
                      tag: 'experimental'
            fail-fast: false
        steps:
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ matrix.node-version }}
            - name: Fail if experimental
              if: ${{ matrix.tag == 'experimental' }}
              run: |
                echo "This is an experimental build and will fail"
                exit 1
            - name: Perform some tests
              run: |
                echo "Running tests on OS ${{ matrix.os }} and NodeJS ${{ matrix.node-version }}"
                sleep 10
            - name: Upload test results
              run: |
                echo "Uploading test results... "
    include-example:
        name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                color: [red, green]
                shape: [circle, square]
                size: [small, large]
                include:
                    - opacity: 50
                    - color: rd
                      opacity: 75
                    - shape: circle
                      opacity: 100
                    - color: red
                      shape: triangle

        steps:
            - name: Dummy Step
              run: |
                echo "The color is ${{ matrix.color }}, the shape is ${{ matrix.shape }}, and the size is ${{ matrix.size }} and opacity is ${{ matrix.opacity }}"