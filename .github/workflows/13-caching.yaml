name: 13 - Using Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                default: true
                description: "Whether to execute cache step"
            node-version:
                type: choice
                default: "24.x"
                description: "Node Version"
                options:
                    - "24.x"
                    - "26.x"
jobs:
    build:
        needs: install-deps
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./13-caching/react-app
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ inputs.node-version }}
            - name: Download cached dependencies
              id: cache
              uses: actions/cache@v6
              with:
                path: ./13-caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.cache-key }}
            - name: Install dependencies
              if: steps.cache.outputs.cache-hit != 'true'
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Build
              run: npm run build
            - name: Deploying to nonprod
              run: |
                echo "Deploying to nonprod...."
    install-deps:
        runs-on: ubuntu-latest
        outputs:
            cache-key: ${{ steps.cache.outputs.cache }}
        defaults:
            run:
                working-directory: ./13-caching/react-app
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ inputs.node-version }}
            - name: Calculate cache key
              id: cache
              run: |
                echo "cache=deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> "$GITHUB_OUTPUT"
            - name: Download cached dependencies
              id: download-cache
              uses: actions/cache@v6
              with:
                path: './13-caching/react-app/node_modules'
                key: ${{ steps.cache.outputs.cache }}
            - name: Install dependencies
              if: steps.download-cache.outputs.cache-hit != 'true'
              run: npm ci
    linting:
        runs-on: ubuntu-latest
        needs: install-deps
        defaults:
            run:
                working-directory: ./13-caching/react-app
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: ${{ inputs.node-version }}
            - name: Download cached dependencies
              uses: actions/cache@v6
              with:
                path: ./13-caching/react-app/node_modules
                key: ${{ needs.install-deps.outputs.cache-key }}
            - name: Testing
              run: npm run test
            - name: Linting
              run: |
                echo "Linting..."